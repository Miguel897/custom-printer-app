# Push a tag like v1.0.0 to build, test and publish ScanDesk.exe as a GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test ScanDesk.slnx -c Release

      - name: Publish single-file exe
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          dotnet publish src/ScanDesk.App -c Release -r win-x64 -o publish -p:Version=$version

      - uses: softprops/action-gh-release@v2
        with:
          files: publish/ScanDesk.exe
          generate_release_notes: true
