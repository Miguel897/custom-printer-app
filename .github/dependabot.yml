# Weekly NuGet updates and monthly GitHub Actions updates, each grouped so that strict branch
# protection does not force an update-branch + CI rerun per PR. Review by hand before merging.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      tests:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "coverlet*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
